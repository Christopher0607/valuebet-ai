<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ValueBet 精算系统</title>
    <style>
      /* 转圈动画放在这里而不是 App 的 <style> 里：登录页和认证加载态都是
         提前 return 的分支，渲染不到 App 主返回里的那个 style 标签。
         放在那边的话这两个界面上的圈是**静止**的——看起来跟卡死一模一样，
         实测就因此误判过一次「页面卡住了」，其实是动画没生效。 */
      @keyframes spin { to { transform: rotate(360deg); } }
      body { background: #080d14; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
